[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanborn-stain-removal"
version = "0.1.0"
description = "Automatic paper stain correction for scanned Sanborn maps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "opencv-python-headless==5.0.0.93",
    "Pillow==12.2.0",
]

[project.scripts]
sanborn-stain = "sanborn_stain.__main__:main"

[tool.setuptools.packages.find]
include = ["sanborn_stain*"]

[tool.setuptools.package-data]
sanborn_stain = ["*.html", "*.js", "*.css"]
